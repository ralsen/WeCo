<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home OS - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .sidebar-item.active { background-color: white; color: #6366f1; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); font-weight: 600; }
        .card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .time-btn.active { background-color: #6366f1; color: white; }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 bg-slate-100 border-r border-slate-200 p-8 flex flex-col shrink-0">
        <div class="mb-12">
            <h1 class="text-xl font-semibold tracking-tighter text-slate-900 flex items-center">
                <span class="w-3 h-3 bg-indigo-500 rounded-full mr-3"></span>
                Home<span class="font-light text-slate-400">Control</span>
            </h1>
        </div>
        
        <nav id="sidebar-nav" class="space-y-2 flex-1 overflow-y-auto">
            <button onclick="showOverview()" id="btn-overview" class="sidebar-item w-full text-left px-5 py-3 rounded-2xl text-slate-500 active">
                🏠 Übersicht
            </button>
            <div class="pt-6 pb-2 px-5 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">Räume</div>
            </nav>

        <div class="mt-auto pt-6 border-t border-slate-200 text-[10px] text-slate-400 uppercase tracking-widest text-center">
            System: <span class="text-emerald-500 font-bold italic">Stable</span>
        </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto p-8 md:p-12">
        
        <header class="mb-12">
            <h2 id="view-title" class="text-4xl font-light text-slate-900 tracking-tight">Dashboard</h2>
            <p id="view-subtitle" class="text-slate-400 mt-1 font-medium uppercase text-[10px] tracking-[0.2em]">Live-Status aller Systeme</p>
        </header>

        <div id="content-area">
            </div>

    </main>

    <script>
        // DATENSTRUKTUR MIT HISTORIE FÜR VERSCHIEDENE ZEITRÄUME
        const homeData = {
            "Wohnzimmer": { 
                temp: 22.5, hum: 45, air: "Gut", window: "Geschlossen",
                history: {
                    "Tag": { labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', 'Jetzt'], data: [21, 20.5, 21.5, 22.8, 23.1, 22.5, 22.5] },
                    "Woche": { labels: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], data: [20, 22, 21, 23, 22, 24, 22.5] },
                    "Monat": { labels: ['Woche 1', 'Woche 2', 'Woche 3', 'Woche 4'], data: [21, 22, 21.5, 22.5] },
                    "Jahr": { labels: ['Jan', 'Mär', 'Mai', 'Jul', 'Sep', 'Nov'], data: [18, 19, 21, 24, 22, 19] },
                    "2 Jahre": { labels: ['2025', '2026'], data: [20.5, 21.2] }
                }
            },
            "Schlafzimmer": { 
                temp: 18.2, hum: 52, air: "Frisch", window: "Offen",
                history: {
                    "Tag": { labels: ['00:00', '08:00', '16:00', 'Jetzt'], data: [19, 18, 17.5, 18.2] },
                    "Woche": { labels: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], data: [18, 17, 19, 18, 18, 17.5, 18.2] }
                }
            }
        };

        let myChart = null;
        let currentActiveRoom = null;

        function init() {
            const nav = document.getElementById('sidebar-nav');
            Object.keys(homeData).forEach(room => {
                const btn = document.createElement('button');
                btn.id = `btn-${room}`;
                btn.className = "sidebar-item w-full text-left px-5 py-3 rounded-2xl text-slate-500 transition-all";
                btn.innerHTML = room;
                btn.onclick = () => showRoomDetail(room);
                nav.appendChild(btn);
            });
            showOverview();
        }

        function showOverview() {
            currentActiveRoom = null;
            updateSidebarActive('btn-overview');
            document.getElementById('view-title').innerText = "Dashboard";
            document.getElementById('view-subtitle').innerText = "Alle Sensoren im Blick";

            let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            for (const [room, data] of Object.entries(homeData)) {
                html += `
                    <div class="card p-6 cursor-pointer hover:shadow-lg hover:shadow-slate-200/50" onclick="showRoomDetail('${room}')">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-semibold text-slate-700">${room}</h3>
                            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
                        </div>
                        <div class="flex items-end space-x-4">
                            <span class="text-3xl font-light">${data.temp}°C</span>
                            <span class="text-sm text-slate-400 mb-1">${data.hum}% Feucht.</span>
                        </div>
                    </div>`;
            }
            html += `</div>`;
            document.getElementById('content-area').innerHTML = html;
        }

        function showRoomDetail(room) {
            currentActiveRoom = room;
            updateSidebarActive(`btn-${room}`);
            const data = homeData[room];
            document.getElementById('view-title').innerText = room;
            document.getElementById('view-subtitle').innerText = "Detailanalyse & Verlauf";

            const timeOptions = ["Tag", "Woche", "Monat", "Jahr", "2 Jahre"];
            let timeButtons = timeOptions.map(opt => 
                `<button onclick="updateChartData('${opt}')" id="tbtn-${opt}" class="time-btn px-4 py-2 text-[10px] font-bold uppercase tracking-widest rounded-xl transition-all border border-slate-200 text-slate-400 hover:border-indigo-300">
                    ${opt}
                </button>`
            ).join('');

            document.getElementById('content-area').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 text-center">
                    <div class="card p-4"><p class="text-[10px] text-slate-400 font-bold uppercase">Temp</p><p class="text-2xl">${data.temp}°C</p></div>
                    <div class="card p-4"><p class="text-[10px] text-slate-400 font-bold uppercase">Feucht</p><p class="text-2xl">${data.hum}%</p></div>
                    <div class="card p-4"><p class="text-[10px] text-slate-400 font-bold uppercase">Qualität</p><p class="text-2xl text-emerald-500">${data.air}</p></div>
                    <div class="card p-4"><p class="text-[10px] text-slate-400 font-bold uppercase">Fenster</p><p class="text-2xl uppercase text-indigo-500 font-light">${data.window}</p></div>
                </div>
                
                <div class="card p-8">
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-[0.2em]">Temperaturverlauf</h4>
                        <div class="flex space-x-2 bg-slate-50 p-1 rounded-2xl">
                            ${timeButtons}
                        </div>
                    </div>
                    <div class="h-[350px]">
                        <canvas id="detailChart"></canvas>
                    </div>
                </div>
            `;
            updateChartData("Tag"); // Standardmäßig 24h laden
        }

        function updateChartData(period) {
            // UI Button Status
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`tbtn-${period}`);
            if(activeBtn) activeBtn.classList.add('active');

            const roomData = homeData[currentActiveRoom].history[period] || homeData[currentActiveRoom].history["Tag"];
            renderChart(roomData.labels, roomData.data);
        }

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('detailChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#6366f1',
                        borderWidth: 4,
                        tension: 0.4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6366f1',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        backgroundColor: (context) => {
                            const gradient = context.chart.ctx.createLinearGradient(0, 0, 0, 350);
                            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.15)');
                            gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 10 }, color: '#94a3b8' } },
                        y: { 
                            grid: { color: '#f1f5f9', drawBorder: false }, 
                            border: { display: false },
                            ticks: { font: { size: 10 }, color: '#94a3b8', callback: (val) => val + '°' }
                        }
                    }
                }
            });
        }

        function updateSidebarActive(activeId) {
            document.querySelectorAll('.sidebar-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById(activeId).classList.add('active');
        }

        init();
    </script>
</body>
</html>
